name: Subscription ports - Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'Minggle/FlClash'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies and analysis
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos
          exit $LASTEXITCODE
      - name: Feature and regression tests
        run: |
          flutter test test/common/port_routing_test.dart test/providers/port_routing_action_test.dart test/views/port_routing_test.dart test/providers/config_test.dart test/providers/backup_action_test.dart test/common/http_test.dart test/core/desktop test/l10n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          go test -C core . -run '^TestPortRoutingWire$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -C core . ./cmd/...
          exit $LASTEXITCODE
      - name: Build
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':', 2)[1].Trim().Split('+')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1).Split('-')[0] }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric release version' }
          flutter build windows --release --build-name=$version
          exit $LASTEXITCODE
      - name: Package
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':', 2)[1].Trim().Split('+')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          New-Item -ItemType Directory -Path dist | Out-Null
          $name = "FlClash-$version-windows-amd64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: subscription-ports-windows
          path: dist/*

  release:
    if: github.repository == 'Minggle/FlClash' && github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: subscription-ports-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
